version: '3.8'

services:
  web:
    build: .
    container_name: django_shop_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hvxn%qq=gyw^4*o2lo1#bw0=wh#ux9s8h!=@c608arf_gz3+^7}
    volumes:
      - static_data:/app/static
      - media_data:/app/media

volumes:
  static_data:
  media_data: